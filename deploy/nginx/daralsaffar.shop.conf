# /etc/nginx/sites-available/daralsaffar.shop.conf
# Proxies to the FrankenPHP container (docker-compose.prod.yml, 127.0.0.1:8095).
# HTTPS is added by: sudo certbot --nginx -d daralsaffar.shop -d www.daralsaffar.shop --redirect
server {
    listen 80;
    listen [::]:80;
    server_name daralsaffar.shop www.daralsaffar.shop;

    # Admin pop-up image uploads.
    client_max_body_size 12m;

    location / {
        proxy_pass         http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
