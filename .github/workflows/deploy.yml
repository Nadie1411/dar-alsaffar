name: Deploy production

# dev  → CI only (ci.yml)
# main → CI, then deploy to https://daralsaffar.shop
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://daralsaffar.shop
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          # Optional. Set them in the repository's Settings > Secrets and variables
          # > Actions; with none set this is a plain deploy. See docs/DEPLOYMENT.md.
          STORE_BACKEND: ${{ vars.STORE_BACKEND }}
          PANEL_OWNER_NAME: ${{ vars.PANEL_OWNER_NAME }}
          PANEL_OWNER_EMAIL: ${{ secrets.PANEL_OWNER_EMAIL }}
          PANEL_OWNER_PASSWORD: ${{ secrets.PANEL_OWNER_PASSWORD }}
        run: |
          # The settings go to the server on standard input, never on a command line,
          # so they are not in any process list or log. %q quotes each one safely.
          {
            for name in STORE_BACKEND PANEL_OWNER_NAME PANEL_OWNER_EMAIL PANEL_OWNER_PASSWORD; do
              printf 'export %s=%q\n' "$name" "${!name}"
            done
            cat <<'EOF'
          set -euo pipefail
          cd ~/apps/dar-alsaffar
          git fetch --prune origin main
          git reset --hard "$1"
          bash scripts/deploy.sh "$1"
          EOF
          } | ssh -i ~/.ssh/deploy_key "$USER@$HOST" bash -s -- "$GITHUB_SHA"

      - name: Smoke test
        run: curl -fsS -o /dev/null -w '%{http_code}\n' https://daralsaffar.shop/up
